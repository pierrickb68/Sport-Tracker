<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Soul Tracker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ═══ SHINIGAMI SILHOUETTE (fixed background) ═══ -->
  <div class="shinigami-bg" aria-hidden="true">
    <svg class="shinigami-svg" viewBox="0 0 300 700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="blade-grad" x1="0" y1="0" x2="0.25" y2="1">
          <stop offset="0%"   stop-color="#f5e878"/>
          <stop offset="30%"  stop-color="#c9a84c"/>
          <stop offset="100%" stop-color="#6a4810"/>
        </linearGradient>
        <filter id="blade-glow" x="-40%" y="-5%" width="180%" height="110%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- ── HAORI CAPE (drawn first, farthest back) ── -->
      <!-- Left flare -->
      <path d="M62,172 C36,192 5,252 -18,356 C-36,448 -26,526 -12,558
               L20,550 C10,512 18,434 33,348 C48,268 65,210 70,188 Z"
            fill="#1c0202"/>
      <!-- Left flutter tail -->
      <path d="M-12,558 C-24,598 -14,618 2,621
               C20,614 28,596 23,578 C14,562 4,560 -12,558 Z"
            fill="#130101"/>
      <!-- Right flare -->
      <path d="M238,172 C264,190 296,250 318,354 C338,446 328,524 314,556
               L283,548 C294,510 286,432 272,346 C258,266 240,208 232,188 Z"
            fill="#1c0202"/>
      <!-- Right flutter tail -->
      <path d="M314,556 C326,596 316,616 300,619
               C282,612 274,594 279,576 C288,560 298,558 314,556 Z"
            fill="#130101"/>

      <!-- ── ZANPAKUTO SWORD ── -->
      <!-- Blade (extends far beyond viewBox — clipped by container) -->
      <path d="M216,210 L395,665 L386,670 L207,216 Z"
            fill="url(#blade-grad)" filter="url(#blade-glow)"/>
      <!-- Blade glint -->
      <line x1="212" y1="213" x2="390" y2="667" stroke="rgba(255,255,220,0.28)" stroke-width="1.5"/>
      <!-- Tsuba / guard -->
      <path d="M196,220 L228,204 L235,215 L203,232 Z" fill="#c9a84c"/>
      <path d="M203,230 L232,213 L228,224 L200,240 Z" fill="#9a6820"/>
      <!-- Tsuka / handle -->
      <path d="M203,230 L232,213 L240,242 L211,259 Z" fill="#6b0a0a"/>
      <!-- Handle wrapping cords -->
      <line x1="207" y1="237" x2="234" y2="221" stroke="#8b0000" stroke-width="2.2"/>
      <line x1="210" y1="247" x2="237" y2="231" stroke="#8b0000" stroke-width="2.2"/>
      <line x1="213" y1="257" x2="240" y2="241" stroke="#8b0000" stroke-width="2.2"/>

      <!-- ── SPIKY HAIR (behind head) ── -->
      <polygon points="76,114 54,6 94,99"    fill="#141414"/>
      <polygon points="96,100 77,-6 116,86"  fill="#141414"/>
      <polygon points="118,87 104,-22 135,75"fill="#141414"/>
      <polygon points="137,77 133,-28 155,67"fill="#141414"/>
      <polygon points="158,70 170,-14 178,65"fill="#141414"/>
      <polygon points="181,67 198,5 198,72"  fill="#141414"/>
      <polygon points="200,77 222,22 210,84" fill="#141414"/>
      <!-- Hair mass connecting all spikes -->
      <path d="M76,114 Q90,58 120,40 Q146,22 170,40 Q192,58 202,84" fill="#1a1a1a"/>

      <!-- ── HEAD ── -->
      <ellipse cx="140" cy="126" rx="45" ry="43" fill="#1d1d1d"/>
      <!-- Ear (subtle) -->
      <ellipse cx="98"  cy="126" rx="7"  ry="11" fill="#191919"/>

      <!-- ── NECK ── -->
      <rect x="128" y="163" width="24" height="20" fill="#1d1d1d"/>

      <!-- ── GI COLLAR / LAPELS ── -->
      <path d="M104,180 L140,216 L176,180 L162,168 L140,198 L118,168 Z" fill="#1d1d1d"/>

      <!-- ── LEFT ARM — wide flowing sleeve ── -->
      <path d="M64,188 L98,182 L94,275 L34,294 L24,278 Z" fill="#222"/>
      <ellipse cx="29" cy="288" rx="14" ry="11" fill="#1d1d1d"/>

      <!-- ── RIGHT ARM — sword grip ── -->
      <path d="M214,186 L246,196 L260,276 L232,284 L204,206 Z" fill="#222"/>
      <ellipse cx="252" cy="280" rx="12" ry="10" fill="#1d1d1d"/>

      <!-- ── MAIN ROBE / TORSO ── -->
      <path d="M96,184 L224,184 L236,350 L64,350 Z" fill="#222"/>

      <!-- Obi belt -->
      <rect x="70" y="304" width="160" height="30" fill="#4a0000" rx="1"/>
      <!-- Obi knot -->
      <rect x="120" y="300" width="30" height="36" fill="#6b0000" rx="3"/>
      <ellipse cx="135" cy="318" rx="12" ry="8" fill="#8b0000"/>

      <!-- ── HAKAMA (wide trousers) ── -->
      <path d="M66,348 L234,348 L242,522 L188,524 L140,400 L92,524 L38,522 Z" fill="#181818"/>

      <!-- ── FEET / TABI ── -->
      <path d="M38,522 L34,538 L100,542 L100,524 Z" fill="#1d1d1d"/>
      <path d="M188,524 L188,542 L254,538 L250,522 Z" fill="#1d1d1d"/>

      <!-- ── WIND / SPEED MOTION LINES ── -->
      <path d="M1,296 L-18,313 L-13,317 L5,300"
            stroke="#3e0808" stroke-width="1.4" fill="none" opacity="0.85"/>
      <path d="M5,334 L-14,351 L-9,355 L9,338"
            stroke="#2e0505" stroke-width="1.1" fill="none" opacity="0.65"/>
      <path d="M312,300 L330,315 L325,319 L308,304"
            stroke="#3e0808" stroke-width="1.4" fill="none" opacity="0.85"/>
    </svg>
    <!-- Reiatsu ground glow -->
    <div class="reiatsu-ground"></div>
  </div>

  <!-- ═══ NAVBAR ═══ -->
  <nav class="navbar">
    <a href="{{ url_for('index') if current_profile else url_for('profiles') }}" class="nav-brand">
      <span class="nav-title"><span class="nav-title-soul">SOUL</span><span class="nav-title-tracker">TRACKER</span></span>
    </a>
    {% if current_profile %}
    <ul class="nav-links">
      <li><a href="{{ url_for('index') }}"       class="{% if request.endpoint == 'index' %}active{% endif %}">Historique</a></li>
      <li><a href="{{ url_for('add_session') }}" class="{% if request.endpoint == 'add_session' %}active{% endif %}">+ Séance</a></li>
      <li><a href="{{ url_for('progression') }}" class="{% if request.endpoint == 'progression' %}active{% endif %}">Progression</a></li>
      <li><a href="{{ url_for('templates_page') }}" class="{% if request.endpoint in ['templates_page', 'templates_new', 'templates_edit'] %}active{% endif %}">Templates</a></li>
      <li class="nav-sep" aria-hidden="true"></li>
      <li>
        <a href="{{ url_for('profiles') }}" class="nav-profile-link {% if request.endpoint == 'profiles' %}active{% endif %}">
          {% if current_avatar_url %}
          <img src="{{ current_avatar_url }}" alt="{{ current_profile }}" class="nav-avatar-img">
          {% else %}
          <span class="nav-profile-initial">{{ current_profile[0].upper() }}</span>
          {% endif %}
          <span>{{ current_profile }}</span>
        </a>
      </li>
    </ul>
    {% endif %}
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
